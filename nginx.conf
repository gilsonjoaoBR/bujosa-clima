server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Atenção: `add_header` dentro de um location substitui os cabeçalhos
    # herdados do server. Por isso o cache abaixo usa `expires`, que não
    # interfere na herança, e o index.html usa `expires -1`.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'self'" always;

    # Health check leve para o Coolify / orquestradores.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Assets com hash no nome: cache longo e imutável.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location ~* \.(?:woff2?|png|jpe?g|webp|avif|svg|ico)$ {
        expires 30d;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    # SPA: qualquer rota desconhecida devolve o index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
